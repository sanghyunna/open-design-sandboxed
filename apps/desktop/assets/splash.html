<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Readable Studio</title>
    <style>
      html,
      body {
        background: #f2f4f5;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        color: #242424;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      video {
        background: #f2f4f5;
        display: block;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        width: 100%;
      }
      .splash-art {
        align-items: center;
        background:
          radial-gradient(circle at 34% 30%, rgba(0, 234, 255, 0.12), transparent 34%),
          radial-gradient(circle at 70% 68%, rgba(238, 255, 0, 0.12), transparent 36%),
          #f2f4f5;
        display: flex;
        inset: 0;
        justify-content: center;
        position: absolute;
      }
      .brand-lockup {
        align-items: center;
        display: flex;
        gap: 22px;
      }
      .brand-icon {
        height: 112px;
        width: 112px;
      }
      .brand-name {
        font-size: 38px;
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      @media (prefers-reduced-motion: no-preference) {
        .brand-lockup {
          animation: reveal 420ms ease-out both;
        }
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(4px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <video
      id="splash"
      autoplay
      muted
      playsinline
      disablepictureinpicture
      src="splash.mp4"
    ></video>
    <main class="splash-art" role="status" aria-label="Loading Readable Studio">
      <div class="brand-lockup">
        <img class="brand-icon" src="splash-icon.svg" alt="" width="112" height="112" />
        <div class="brand-name">Readable Studio</div>
      </div>
    </main>
    <script>
      (function () {
        var video = document.getElementById("splash");
        if (!video) return;
        var play = function () {
          var attempt = video.play();
          if (attempt && typeof attempt.catch === "function") attempt.catch(function () {});
        };
        var markFinished = function () {
          document.documentElement.setAttribute("data-od-splash-finished", "1");
        };
        video.addEventListener("loadedmetadata", function () { video.currentTime = 0; });
        video.addEventListener("loadeddata", play);
        video.addEventListener("ended", markFinished);
        video.addEventListener("error", markFinished);
        play();
      })();
    </script>
  </body>
</html>
