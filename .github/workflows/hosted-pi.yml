name: Hosted Pi artifact

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hosted-pi:
    name: Hosted / ${{ matrix.displayName }} x64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            displayName: Windows
          - os: ubuntu-24.04
            displayName: Linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process'); const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); console.log(actual); if(actual!==process.env.EXPECTED_SHA) process.exit(1)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Assert supported architecture
        run: node -e "if (process.arch !== 'x64') process.exit(1)"
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete prior hosted suite
        run: node --experimental-strip-types tools/pack/src/hosted-validation.ts pr04
      - name: Run PR06 snapshot boundary suite
        run: node --experimental-strip-types tools/pack/src/hosted-validation.ts pr06
      - name: Run PR07 hosted traffic boundary suite
        run: node --experimental-strip-types tools/pack/src/hosted-validation.ts pr07
      - name: Stage hosted artifact
        run: pnpm --filter @open-design/tools-pack hosted:pi:build -- --out .tmp/hosted-pi-artifact-${{ matrix.os }}
      - name: Execute staged artifact smoke suite
        run: pnpm --filter @open-design/tools-pack hosted:pi:check -- --out .tmp/hosted-pi-artifact-${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-pi-${{ matrix.os }}
          path: .tmp/hosted-pi-artifact-${{ matrix.os }}
          if-no-files-found: error

  nix-packaging:
    name: Hosted / Nix dependency hash and flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process'); const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); console.log(actual); if(actual!==process.env.EXPECTED_SHA) process.exit(1)"
      - uses: cachix/install-nix-action@v31
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh and validate Nix pnpm dependency hash
        run: |
          pnpm nix:update-hash
          nix flake check --print-build-logs --keep-going
          git diff --exit-code -- nix/pnpm-deps.nix
